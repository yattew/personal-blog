<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0b0e" id="meta-theme-color" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Film Archive" />
  
  <title>Japan Journey — 35mm Continuous Film Roll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@700;800&family=Orbitron:wght@700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Space+Grotesk:wght@600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=59" />
</head>
<body class="film-aesthetic">
  <!-- Dual-Layer Ambient Backdrop for Ultra-Smooth Organic Color Crossfading -->
  <div class="ambient-backdrop" id="ambient-backdrop" aria-hidden="true">
    <div class="ambient-layer ambient-layer-a active" id="ambient-layer-a"></div>
    <div class="ambient-layer ambient-layer-b" id="ambient-layer-b"></div>
  </div>

  <!-- 1 Global Optical Lens Vignette & Fine Film Grain -->
  <div class="analog-vignette" aria-hidden="true"></div>
  <canvas id="grain-canvas" class="master-film-grain" aria-hidden="true"></canvas>

  <!-- Viewport Stage (Zero Vertical Scroll Lock) -->
  <div class="viewport-stage">
    
    <!-- Top Ambient Breathing Spacer -->
    <div class="top-ambient-spacer" aria-hidden="true"></div>

    <!-- 80% Height 35mm Continuous Film Gate -->
    <main class="film-gate" id="film-gate" aria-label="35mm Film Roll Viewer">
      
      <!-- 1. Authentic High-End 3D Metal Film Canister (Permanently Anchored on Far Left) -->
      <aside class="film-canister-unit" id="film-canister-unit" role="region" aria-label="35mm Metal Film Canister">
        <!-- 3D Cylindrical Metal Canister Body -->
        <div class="canister-cylinder" aria-hidden="true">
          <!-- Top Stamped Chrome Cap with Spool Spindle Hub -->
          <div class="canister-end-cap top">
            <div class="spool-spindle-nub">
              <div class="spindle-core"></div>
              <div class="spindle-tooth tooth-1"></div>
              <div class="spindle-tooth tooth-2"></div>
              <div class="spindle-tooth tooth-3"></div>
            </div>
            <div class="cap-rim-highlight"></div>
          </div>
          
          <!-- Anodized Lithographed Livery (DynaStill400X 3D Cylindrical Livery) -->
          <div class="canister-label" id="canister-label">
            <!-- Dual-Layer Anodized Crossfade Backgrounds -->
            <div class="canister-bg-layer layer-a active" id="canister-bg-a"></div>
            <div class="canister-bg-layer layer-b" id="canister-bg-b"></div>

            <!-- Photorealistic 3D Cylinder Curvature Shading (Overlays across all text) -->
            <div class="cylinder-curvature-shading" aria-hidden="true"></div>
            <div class="cylinder-curve-shadow" aria-hidden="true"></div>

            <!-- 3D Cylindrical Content Layout: Vertical Brand Spine + Horizontal Technical Panel -->
            <div class="canister-cylinder-wrap">
              <!-- Left Column: Iconic Vertical Brand Spine -->
              <div class="canister-brand-spine">
                <div class="canister-brand-vertical">
                  <span class="brand-name">DynaStill</span><span class="brand-iso">400X</span>
                </div>
              </div>

              <!-- Right Column: Horizontal Technical Panel & DX Contact Grid -->
              <div class="canister-technical-panel">
                <!-- Top Group: DX Contact Matrix & Speed Badge -->
                <div class="canister-tech-top">
                  <div class="cas-sensor-grid" title="DX Auto-Sensing Contact Matrix">
                    <div class="cas-pad silver"></div>
                    <div class="cas-pad black"></div>
                    <div class="cas-pad silver"></div>
                    <div class="cas-pad silver"></div>
                    <div class="cas-pad black"></div>
                    <div class="cas-pad silver"></div>
                    <div class="cas-pad silver"></div>
                    <div class="cas-pad silver"></div>
                    <div class="cas-pad black"></div>
                    <div class="cas-pad silver"></div>
                    <div class="cas-pad silver"></div>
                    <div class="cas-pad black"></div>
                  </div>

                  <div class="canister-speed-badge" id="canister-speed-badge">
                    <span class="speed-iso" id="canister-speed-iso">400X</span>
                    <span class="speed-type" id="canister-speed-type">DAYLIGHT</span>
                  </div>
                </div>

                <!-- Center Group: Technical Emulsion Specifications -->
                <div class="canister-specs" id="canister-specs">
                  <span class="spec-line spec-bold">35mm COLOR NEGATIVE</span>
                  <span class="spec-line">ISO 400/27° • 36 EXP</span>
                  <span class="spec-line">PROCESS C-41 / ECN-2</span>
                </div>

                <!-- Bottom Group: Factory Emulsion Stamp -->
                <div class="canister-emulsion-stamp" id="canister-emulsion-stamp">EMUL DS400X-2409 • EXP 11/26</div>
              </div>
            </div>
          </div>

          <!-- Bottom Stamped Chrome Cap -->
          <div class="canister-end-cap bottom">
            <div class="cap-rim-highlight"></div>
            <div class="bottom-dimple"></div>
          </div>
        </div>

        <!-- Velvet Plush Felt Light-Trap Snout (Film Emerges from this Slit) -->
        <div class="canister-snout" aria-hidden="true">
          <div class="snout-jaw-inner"></div>
          <div class="velvet-slit">
            <div class="velvet-felt-texture"></div>
            <div class="slit-depth-shadow"></div>
          </div>
          <div class="snout-jaw-outer"></div>
          <div class="snout-exit-shadow"></div>
        </div>
      </aside>

      <!-- 2. One Unified Unbroken 35mm Celluloid Ribbon (Unrolls to the Right) -->
      <div class="film-roll-ribbon" id="film-roll-ribbon">
        
        <!-- Continuous Celluloid Film Strip Body (Frames 13 to 01) -->
        <div class="film-main-strip" id="film-main-strip">
          <!-- Continuous Top Sprocket Track -->
          <div class="continuous-sprocket-track top" id="top-sprocket-track" aria-hidden="true">
            <div class="sprocket-perforations-continuous top"></div>
            <div class="sprocket-codes-layer" id="top-sprocket-codes"></div>
          </div>

          <!-- Middle Exposure Frames (Zero Seams, Natural Celluloid Rebates) -->
          <div class="film-exposures-track" id="film-exposures-track">
            <!-- Rendered dynamically -->
          </div>

          <!-- Continuous Bottom Sprocket Track -->
          <div class="continuous-sprocket-track bottom" id="bottom-sprocket-track" aria-hidden="true">
            <div class="sprocket-perforations-continuous bottom"></div>
            <div class="sprocket-codes-layer" id="bottom-sprocket-codes"></div>
          </div>
        </div>

        <!-- 3. Classic 35mm Tapered Film Leader (Far Right Tongue Moving Away from Canister) -->
        <div class="film-leader-unit" id="film-leader-unit" role="button" tabindex="0" aria-label="35mm Film Leader Tongue">
          <!-- Rendered dynamically with tapered celluloid tongue pointing right -->
        </div>

      </div>
    </main>

    <!-- Physical Film Controls Stationed Outside the Film Roll -->
    <footer class="external-film-controls" aria-label="Film Navigation Controls">
      <!-- Physical Rewind Button -->
      <button class="physical-winder-btn prev" id="prev-scene-btn" aria-label="Rewind to Previous Frame">
        <span class="winder-icon">◀</span>
        <span class="winder-text">Rewind</span>
      </button>

      <!-- Physical Film Frame Counter & Emulsion Tag -->
      <div class="physical-frame-counter">
        <div class="counter-led">
          <span class="led-num" id="current-frame-num">EXP 02</span>
          <span class="led-sep">//</span>
          <span class="led-total" id="total-frames-num">36</span>
        </div>
        <span class="counter-stock" id="current-stock-tag">DynaStill400X</span>
      </div>

      <!-- Physical Advance Button -->
      <button class="physical-winder-btn next" id="next-scene-btn" aria-label="Advance to Next Frame">
        <span class="winder-text">Advance</span>
        <span class="winder-icon">▶</span>
      </button>
    </footer>

  </div>

  <!-- 35mm Slide Lightbox Modal (Full-Screen Darkroom Inspector) -->
  <div id="photo-lightbox" class="photo-lightbox" aria-hidden="true" role="dialog" aria-label="35mm Frame Lightbox">
    <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
    <div class="lightbox-dialog">
      <button class="lightbox-close-btn" id="lightbox-close-btn" aria-label="Close Lightbox">✕</button>
      <div class="lightbox-photo-wrap">
        <img id="lightbox-photo-img" class="lightbox-photo-img" src="" alt="" />
      </div>
      <div class="lightbox-caption">
        <div class="lightbox-meta">
          <span class="lightbox-badge" id="lightbox-badge">EXP 01 // 35MM</span>
          <span class="lightbox-date" id="lightbox-date"></span>
        </div>
        <h2 class="lightbox-title" id="lightbox-title"></h2>
      </div>
    </div>
  </div>

  <!-- Native Mobile Floating Toast -->
  <div id="mobile-toast" class="mobile-toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js?v=59"></script>
</body>
</html>
